<div class="composer">
  <div class="toprow">
    @if (skills().length > 0) {
      <div class="skills">
        @for (skill of skills(); track skill.id) {
          <button
            class="chip"
            type="button"
            [class.is-active]="isSelected(skill.id)"
            (click)="toggleSkill(skill.id)"
          >
            {{ skill.label }}
          </button>
        }
      </div>
    }
    <span class="grow"></span>
    <span class="save" [class.is-busy]="saving()">{{ saving() ? 'saving…' : 'saved' }}</span>
    <button class="newbtn" type="button" (click)="newDraft()">New</button>
  </div>

  <div class="inputwrap">
    <ac-composer-editor
      #editor
      [initialDoc]="initialDoc()"
      (docChange)="onDocChange($event)"
      (fileDropped)="onFileDropped($event)"
      (submit)="send()"
    />
  </div>

  <div class="actions">
    <span class="counts">{{ counts().lines }}L · {{ counts().chars }}C</span>
    <span class="grow"></span>
    <div class="send">
      <button class="send-main" type="button" [disabled]="!canSend()" (click)="send()">
        @if (target(); as t) {
          Send to <b>{{ targetLabel(t) }}</b>
        } @else {
          No session
        }
        <span class="kbd">⌘↩</span>
      </button>
      <button
        class="send-caret"
        type="button"
        [disabled]="sessions().length === 0"
        (click)="toggleTargetMenu()"
        aria-label="Choose target session"
      >
        ▾
      </button>

      @if (targetMenuOpen()) {
        <div class="menu">
          @for (session of sessions(); track session.key) {
            <button class="menu-item" type="button" (click)="pickTarget(session)">
              <span class="dot" [class]="session.turnState"></span>
              {{ targetLabel(session) }}
              <span class="menu-state">{{ session.turnState }}</span>
            </button>
          }
        </div>
      }
    </div>
  </div>
</div>
