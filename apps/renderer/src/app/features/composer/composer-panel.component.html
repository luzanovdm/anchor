<div class="composer">
  <div class="toprow">
    @if (skills().length > 0) {
      <div class="skills">
        @for (skill of skills(); track skill.id) {
          <button
            ttChip
            [active]="isSelected(skill.id)"
            (click)="toggleSkill(skill.id)"
          >
            {{ skill.label }}
          </button>
        }
      </div>
    }
    <span class="grow"></span>
    <span class="save" [class.is-busy]="saving()">{{ saving() ? 'saving…' : 'saved' }}</span>
    <button ttButton variant="secondary" size="sm" (click)="newDraft()">New</button>
  </div>

  <div class="inputwrap" (keydown)="onKeydown($event)" (drop)="onDrop($event)" (dragover)="onDragOver($event)">
    <tt-textarea
      [value]="body()"
      (valueChange)="onBodyChange($event)"
      placeholder="Write a message…  ⌘↩ to send"
      ariaLabel="Message"
      [rows]="3"
    />
  </div>

  <div class="actions">
    <span class="counts">{{ counts().lines }}L · {{ counts().chars }}C</span>
    <span class="grow"></span>
    <div class="send">
      @if (isWorking() && !isGui()) {
        <button
          ttButton
          variant="secondary"
          size="sm"
          [disabled]="!canSend()"
          (click)="steer()"
          title="Inject now, mid-turn"
        >
          Steer
        </button>
      }
      <button ttButton variant="primary" [disabled]="!canSend()" (click)="send()">
        @if (target(); as t) {
          {{ isGui() ? 'Copy for' : 'Send to' }} {{ targetLabel(t) }}
        } @else {
          No session
        }
        <span class="kbd">⌘↩</span>
      </button>
      <button
        ttButton
        variant="secondary"
        [iconOnly]="true"
        [disabled]="sessions().length === 0"
        (click)="toggleTargetMenu()"
        aria-label="Choose target session"
      >
        ▾
      </button>

      @if (targetMenuOpen()) {
        <div class="menu">
          @for (session of sessions(); track session.key) {
            <button class="menu-item" type="button" (click)="pickTarget(session)">
              <span class="dot" [class]="session.turnState"></span>
              {{ targetLabel(session) }}
              <span class="menu-state">{{ session.turnState }}</span>
            </button>
          }
        </div>
      }
    </div>
  </div>
</div>
